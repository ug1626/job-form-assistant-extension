<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Form Assistant</title>
  <style>
    body {
      width: 300px;
      padding: 10px;
      font-family: sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    input[type="url"] {
      width: 100%;
      padding: 5px;
    }
    button {
      padding: 8px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    #status {
      margin-top: 10px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Form Assistant</h2>
    <input type="url" id="companyUrl" placeholder="企業のWebサイトURLを入力">
    <button id="analyze">分析開始</button>
    <div id="status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
